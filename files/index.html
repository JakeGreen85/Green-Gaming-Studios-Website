    <p>Green Gaming Studios is an indie game studio crafting cozy, handcrafted games made with obsessive care. Founded in 2024, the studio is run by a solo developer with a Master's in Games.</p>
    <h2>What we make</h2>
    <p>Games that respect player agency and don't ask you to grind — made with obsessive care for how they play. No live service, no grind, no compromise on how it feels.</p>

    <p>Join the rebellion in Rebels of the Realm — a co-op action RPG where the fate of the world is a group effort, and every battle is a chance to be heroic in the most unexpectedly fun ways. Currently in alpha (combat &amp; realm building), coming to PC.</p>
